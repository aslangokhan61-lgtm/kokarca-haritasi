<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Database Query Test</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <h1>Query Results</h1>
    <pre id="output">Loading...</pre>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBk53aTZ5cB2G_Fq64jRgkErEwmqOGNOBs",
            authDomain: "kokarca-tuzak-takip-sist-99696.firebaseapp.com",
            projectId: "kokarca-tuzak-takip-sist-99696",
            storageBucket: "kokarca-tuzak-takip-sist-99696.firebasestorage.app",
            messagingSenderId: "125586984500",
            appId: "1:125586984500:web:dbcc8cb4cad8904a2a8461",
            measurementId: "G-WXJQ4DJLJX"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function runQueries() {
            try {
                const results = {};

                // 1. Query Derepazarı traps
                const derepazariSnap = await db.collection("tuzaklar").where("ilce", "==", "Derepazarı").get();
                const derepazariTraps = [];
                derepazariSnap.forEach(doc => {
                    derepazariTraps.push({ id: doc.id, ...doc.data() });
                });
                results.derepazariTraps = derepazariTraps;

                // 2. Query Samurai wasp release records
                const samuraiSnap = await db.collection("tuzaklar").where("kayitTuru", "==", "Samuray Arısı Salımı").get();
                const samuraiReleases = [];
                samuraiSnap.forEach(doc => {
                    samuraiReleases.push({ id: doc.id, ...doc.data() });
                });
                results.samuraiReleases = samuraiReleases;

                // 3. Query any other possible duplicate Derepazari surveys
                const allSnap = await db.collection("tuzaklar").get();
                const derepazariFuzzy = [];
                allSnap.forEach(doc => {
                    const data = doc.data();
                    if (data.ilce && data.ilce.includes("Derepazar")) {
                        derepazariFuzzy.push({ id: doc.id, ...data });
                    }
                });
                results.derepazariFuzzy = derepazariFuzzy;

                document.getElementById("output").textContent = JSON.stringify(results, null, 2);
            } catch (err) {
                document.getElementById("output").textContent = "Error: " + err.stack;
            }
        }
        runQueries();
    </script>
</body>
</html>
