<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genel İstatistikler - Kokarca Takip Sistemi</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #008e43;
            --primary-light: #10b981;
            --primary-dark: #064e3b;
            --secondary-blue: #1d4ed8;
            --bg-light: #f8fafc;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-glass: rgba(0, 0, 0, 0.08);
            --radius-lg: 24px;
            --radius-md: 16px;
            --font: 'Outfit', sans-serif;
            --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.03);
        }

        body.dark-mode {
            --bg-light: #0f172a;
            --text-dark: #f8fafc;
            --text-muted: #94a3b8;
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font);
            transition: background-color 0.3s, border-color 0.3s;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .dashboard-container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 30px;
            box-shadow: var(--shadow);
        }

        body.dark-mode .dashboard-container {
            background: rgba(30, 41, 59, 0.8);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 1.5px solid var(--border-glass);
            padding-bottom: 20px;
        }

        .title-area h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        body.dark-mode .title-area h1 {
            color: var(--primary-light);
        }

        .title-area p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .theme-toggle-btn {
            background: var(--border-glass);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
            color: var(--text-dark);
            cursor: pointer;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-control {
            width: 100%;
            height: 44px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glass);
            background: white;
            color: var(--text-dark);
            padding: 0 16px;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }
        body.dark-mode .filter-control {
            background: #1e293b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border: 1.5px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 24px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
        }
        body.dark-mode .stat-card {
            background: #1e293b;
        }

        .stat-val {
            font-size: 36px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .stat-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chart-box {
            background: white;
            border: 1.5px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            min-height: 350px;
        }
        body.dark-mode .chart-box {
            background: #1e293b;
        }

        .chart-header {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--text-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-light);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-glass);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
        <p style="font-weight: 600; font-size: 14px;">Veriler yükleniyor, lütfen bekleyin...</p>
    </div>

    <div class="dashboard-container">
        <div style="margin-bottom: 15px;">
            <a href="index.html" style="display: inline-flex; align-items: center; gap: 6px; text-decoration: none; background: var(--border-glass); color: var(--text-dark); padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 12px; transition: all 0.2s;">
                ⬅️ Geri Dön (Harita)
            </a>
        </div>
        <div class="header">
            <div class="title-area">
                <h1><span>📊</span> Genel İstatistikler</h1>
                <p>Kokarca Tuzak Takip Sistemi Raporlama Ekranı</p>
            </div>
            <div>
                <button class="theme-toggle-btn" onclick="toggleTheme()">🌓 Tema Değiştir</button>
            </div>
        </div>

        <div class="filters-grid">
            <div class="filter-group">
                <label for="filterModul">Modül (Zararlı / Meyve)</label>
                <select id="filterModul" class="filter-control" onchange="verileriYukle()">
                    <option value="tuzaklar">Kahverengi Kokarca (Marmara/Karadeniz)</option>
                    <option value="tuzaklar_turuncgil">Turunçgil Uzun Antenli Böceği</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterIlce">İlçe</label>
                <select id="filterIlce" class="filter-control" onchange="filtreleVeHesapla()">
                    <option value="Tümü">Tümü (Tüm İlçeler)</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterYil">Asılış Yılı</label>
                <select id="filterYil" class="filter-control" onchange="filtreleVeHesapla()">
                    <option value="Tümü">Tümü (Tüm Yıllar)</option>
                </select>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div id="valTuzak" class="stat-val" style="color: var(--primary);">0</div>
                <div class="stat-label">Toplam Tuzak</div>
            </div>
            <div class="stat-card">
                <div id="valBocek" class="stat-val" style="color: #ef4444;">0</div>
                <div class="stat-label">Toplam Böcek</div>
            </div>
            <div class="stat-card">
                <div id="valYogun" class="stat-val" style="color: #d97706; font-size: 20px; min-height: 43px; display: flex; align-items: center; justify-content: center;">-</div>
                <div class="stat-label">En Yoğun İlçe</div>
            </div>
            <div class="stat-card">
                <div id="valOrt" class="stat-val" style="color: #7c3aed;">0</div>
                <div class="stat-label">Ort. Böcek/Tuzak</div>
            </div>
        </div>

        <div class="chart-box">
            <div class="chart-header">
                <span>📈 İlçe Bazlı Böcek Dağılım Grafiği</span>
            </div>
            <div style="position: relative; height: 300px; width: 100%;">
                <canvas id="distChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyBk53aTZ5cB2G_Fq64jRgkErEwmqOGNOBs",
            authDomain: "kokarca-tuzak-takip-sist-99696.firebaseapp.com",
            projectId: "kokarca-tuzak-takip-sist-99696",
            storageBucket: "kokarca-tuzak-takip-sist-99696.firebasestorage.app",
            messagingSenderId: "125586984500",
            appId: "1:125586984500:web:dbcc8cb4cad8904a2a8461",
            measurementId: "G-WXJQ4DJLJX"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        var hamVeriler = [];
        var statisticsChart = null;

        // Tema Ayarları
        if (localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark-mode");
        }

        function toggleTheme() {
            var isDark = document.body.classList.toggle("dark-mode");
            localStorage.setItem("darkMode", isDark);
            if (statisticsChart) renderChart(statisticsChart.data.labels, statisticsChart.data.datasets[0].data);
        }

        // Verileri Firestore'dan Çek
        function verileriYukle() {
            var loading = document.getElementById("loading");
            if (loading) loading.style.display = "flex";

            var collName = document.getElementById("filterModul").value;
            db.collection(collName).get().then(function(querySnapshot) {
                hamVeriler = [];
                querySnapshot.forEach(function(doc) {
                    var data = doc.data();
                    data.id = doc.id;
                    hamVeriler.push(data);
                });

                // Filtreleri doldur
                ilceleriDoldur();
                yillariDoldur();

                // Hesaplamaları yap
                filtreleVeHesapla();

                if (loading) loading.style.display = "none";
            }).catch(function(err) {
                console.error("Veri çekme hatası:", err);
                alert("Veritabanı bağlantı hatası oluştu.");
                if (loading) loading.style.display = "none";
            });
        }

        function ilceleriDoldur() {
            var select = document.getElementById("filterIlce");
            var secili = select.value;
            select.innerHTML = '<option value="Tümü">Tümü (Tüm İlçeler)</option>';
            
            var ilceler = {};
            hamVeriler.forEach(function(t) {
                if (t.ilce) ilceler[t.ilce] = true;
            });

            var sortedIlce = Object.keys(ilceler).sort(function(a,b) { return a.localeCompare(b, 'tr'); });
            sortedIlce.forEach(function(ilce) {
                var option = document.createElement("option");
                option.value = ilce;
                option.innerText = ilce;
                select.appendChild(option);
            });

            if (sortedIlce.indexOf(secili) !== -1) {
                select.value = secili;
            } else {
                select.value = "Tümü";
            }
        }

        function yillariDoldur() {
            var select = document.getElementById("filterYil");
            var secili = select.value;
            select.innerHTML = '<option value="Tümü">Tümü (Tüm Yıllar)</option>';

            var yillar = {};
            hamVeriler.forEach(function(t) {
                var yil = null;
                var dateStr = t.tuzakİlkAsiliTarih || t.tarih || "";
                if (dateStr && dateStr.length >= 4) {
                    var parts = dateStr.split('.');
                    if (parts.length === 3) {
                        yil = parts[2].split(' ')[0];
                    } else {
                        var parts2 = dateStr.split('-');
                        if (parts2.length === 3) yil = parts2[0];
                    }
                }
                if (yil && yil.length === 4 && !isNaN(parseInt(yil))) {
                    yillar[yil] = true;
                }
            });

            var sortedYillar = Object.keys(yillar).sort().reverse();
            sortedYillar.forEach(function(yil) {
                var option = document.createElement("option");
                option.value = yil;
                option.innerText = yil;
                select.appendChild(option);
            });

            if (sortedYillar.indexOf(secili) !== -1) {
                select.value = secili;
            } else {
                select.value = "Tümü";
            }
        }

        function checkYearMatch(t, seciliYil) {
            var dateStr = t.tuzakİlkAsiliTarih || t.tarih || "";
            if (!dateStr) return false;
            var parts = dateStr.split('.');
            if (parts.length === 3) {
                return parts[2].split(' ')[0] === seciliYil;
            }
            var parts2 = dateStr.split('-');
            if (parts2.length === 3) {
                return parts2[0] === seciliYil;
            }
            return false;
        }

        function filtreleVeHesapla() {
            var filterIlce = document.getElementById("filterIlce").value;
            var filterYil = document.getElementById("filterYil").value;

            var toplamTuzak = 0;
            var toplamBocek = 0;
            var ilceBocek = {};

            hamVeriler.forEach(function(t) {
                var ilceUyumlu = (filterIlce === "Tümü" || t.ilce === filterIlce);
                var yilUyumlu = (filterYil === "Tümü" || checkYearMatch(t, filterYil));

                if (ilceUyumlu && yilUyumlu) {
                    toplamTuzak++;
                    var bocek = (parseInt(t.bocekSayisi) || 0) + (parseInt(t.nimfSayisi) || 0);
                    toplamBocek += bocek;

                    var ilce = t.ilce || 'Bilinmiyor';
                    if (!ilceBocek[ilce]) ilceBocek[ilce] = 0;
                    ilceBocek[ilce] += bocek;
                }
            });

            var enYogunIlce = '-';
            var maxBocek = 0;
            for (var i in ilceBocek) {
                if (ilceBocek[i] > maxBocek) {
                    maxBocek = ilceBocek[i];
                    enYogunIlce = i;
                }
            }

            var ort = toplamTuzak > 0 ? (toplamBocek / toplamTuzak).toFixed(1) : '0';

            // Sayısal değerleri arayüze yaz
            document.getElementById("valTuzak").innerText = toplamTuzak;
            document.getElementById("valBocek").innerText = toplamBocek;
            document.getElementById("valYogun").innerText = enYogunIlce;
            document.getElementById("valOrt").innerText = ort;

            // Grafiği güncelle
            var chartLabels = Object.keys(ilceBocek).sort(function(a,b) { return ilceBocek[b] - ilceBocek[a]; });
            var chartData = chartLabels.map(function(lbl) { return ilceBocek[lbl]; });

            renderChart(chartLabels, chartData);
        }

        function renderChart(labels, data) {
            var ctx = document.getElementById("distChart").getContext("2d");
            
            if (statisticsChart) {
                statisticsChart.destroy();
            }

            var isDark = document.body.classList.contains("dark-mode");
            var textColor = isDark ? '#f8fafc' : '#0f172a';
            var gridColor = isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.05)';

            statisticsChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Toplam Böcek Sayısı',
                        data: data,
                        backgroundColor: '#10b981',
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: textColor,
                                font: { family: 'Outfit', weight: 'bold' }
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: textColor, font: { family: 'Outfit' } },
                            grid: { color: gridColor }
                        },
                        y: {
                            ticks: { color: textColor, font: { family: 'Outfit' } },
                            grid: { color: gridColor }
                        }
                    }
                }
            });
        }

        // Sayfa açılışında verileri otomatik yükle
        window.onload = verileriYukle;
    </script>
</body>
</html>
