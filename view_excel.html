<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Excel Görüntüleyici</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8fafc; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; }
        th { background: #f1f5f9; }
        .sheet-btn { padding: 8px 16px; margin-right: 8px; cursor: pointer; background: #0284c7; color: white; border: none; border-radius: 4px; }
        .sheet-btn:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Excel Görüntüleyici</h2>
        <input type="file" id="upload" accept=".xlsx, .xls">
    </div>
    <div id="sheets" class="card" style="display:none;">
        <h3>Sayfalar</h3>
        <div id="sheet-buttons"></div>
    </div>
    <div id="output" class="card" style="display:none;">
        <h3 id="sheet-title">Veri</h3>
        <div id="table-container" style="overflow-x:auto;"></div>
    </div>

    <script>
        var wb = null;
        document.getElementById('upload').addEventListener('change', function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                var data = new Uint8Array(e.target.result);
                wb = XLSX.read(data, {type: 'array'});
                
                document.getElementById('sheets').style.display = 'block';
                var btnContainer = document.getElementById('sheet-buttons');
                btnContainer.innerHTML = '';
                
                wb.SheetNames.forEach(function(name) {
                    var btn = document.createElement('button');
                    btn.className = 'sheet-btn';
                    btn.innerText = name;
                    btn.onclick = function() { showSheet(name); };
                    btnContainer.appendChild(btn);
                });
                
                if (wb.SheetNames.length > 0) {
                    showSheet(wb.SheetNames[0]);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function showSheet(name) {
            if (!wb) return;
            var ws = wb.Sheets[name];
            var html = XLSX.utils.sheet_to_html(ws);
            document.getElementById('output').style.display = 'block';
            document.getElementById('sheet-title').innerText = "Sayfa: " + name;
            document.getElementById('table-container').innerHTML = html;
        }
    </script>
</body>
</html>
