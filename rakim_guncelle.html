<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Tuzak Rakım Güncelleme Aracı</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            padding: 30px;
            max-width: 800px;
            margin: 0 auto;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }
        h2 {
            color: #0f766e;
            margin-top: 0;
        }
        .btn {
            background: #0f766e;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn:hover { background: #0d9488; }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        #log {
            margin-top: 20px;
            background: #0f172a;
            color: #38bdf8;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .progress-bar {
            height: 10px;
            background: #e2e8f0;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        .progress-fill {
            height: 100%;
            background: #14b8a6;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🏔️ Sürvey Tuzakları Rakım Güncelleme Aracı</h2>
        <p>Bu araç veritabanındaki tüm tuzakların koordinatlarını okur, Open-Meteo İrtifa API'si üzerinden rakım verilerini toplu olarak çekip veritabanına kaydeder.</p>
        
        <button id="startBtn" class="btn" onclick="startUpdate()">Güncellemeyi Başlat</button>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div id="status" style="font-weight: bold;">Hazır. Başlatmak için butona tıklayın.</div>

        <div id="log">İşlem bekleniyor...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBk53aTZ5cB2G_Fq64jRgkErEwmqOGNOBs",
            authDomain: "kokarca-tuzak-takip-sist-99696.firebaseapp.com",
            projectId: "kokarca-tuzak-takip-sist-99696",
            storageBucket: "kokarca-tuzak-takip-sist-99696.firebasestorage.app",
            messagingSenderId: "125586984500",
            appId: "1:125586984500:web:dbcc8cb4cad8904a2a8461",
            measurementId: "G-WXJQ4DJLJX"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function log(msg) {
            const logBox = document.getElementById('log');
            logBox.innerText += msg + "\n";
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function startUpdate() {
            document.getElementById('startBtn').disabled = true;
            const logBox = document.getElementById('log');
            logBox.innerText = "";
            log("🚀 İşlem başladı. Veritabanından tuzaklar okunuyor...");

            try {
                // 1. Fetch all documents from 'tuzaklar'
                const snapshot = await db.collection("tuzaklar").get();
                const totalTraps = snapshot.size;
                log(`📊 Veritabanında toplam ${totalTraps} adet kayıt bulundu.`);

                if (totalTraps === 0) {
                    document.getElementById('status').innerText = "Tuzak bulunamadı.";
                    document.getElementById('startBtn').disabled = false;
                    return;
                }

                const traps = [];
                snapshot.forEach(doc => {
                    traps.push({ id: doc.id, ...doc.data() });
                });

                // Filter traps that have valid lat/lng and optionally do not have rakim
                const validTraps = traps.filter(t => t.lat !== undefined && t.lng !== undefined && !isNaN(t.lat) && !isNaN(t.lng) && t.lat !== 0 && t.lng !== 0);
                log(`🔍 Geçerli koordinata sahip tuzak sayısı: ${validTraps.length}`);

                if (validTraps.length === 0) {
                    document.getElementById('status').innerText = "Güncellenecek koordinata sahip tuzak bulunamadı.";
                    document.getElementById('startBtn').disabled = false;
                    return;
                }

                // Group coordinates in batches of 50
                const batchSize = 50;
                let updatedCount = 0;

                for (let i = 0; i < validTraps.length; i += batchSize) {
                    const batch = validTraps.slice(i, i + batchSize);
                    
                    const lats = batch.map(t => t.lat).join(',');
                    const lngs = batch.map(t => t.lng).join(',');

                    log(`📡 API'den batch veri çekiliyor (${i + 1} - ${Math.min(i + batchSize, validTraps.length)})...`);
                    
                    const response = await fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lngs}`);
                    if (!response.ok) {
                        throw new Error(`Open-Meteo API hatası: ${response.statusText}`);
                    }

                    const resData = await response.json();
                    const elevations = resData.elevation;

                    log(`💾 Veritabanı güncelleniyor...`);
                    for (let j = 0; j < batch.length; j++) {
                        const trap = batch[j];
                        const elev = elevations[j] !== undefined && elevations[j] !== null ? Math.round(elevations[j]) : null;
                        
                        if (elev !== null) {
                            await db.collection("tuzaklar").doc(trap.id).update({
                                rakim: elev
                            });
                            log(`   ✓ [${trap.ilce} - ${trap.koy}] (ID: ${trap.id}) -> Rakım: ${elev} m`);
                            updatedCount++;
                        }
                    }

                    const pct = Math.round((updatedCount / validTraps.length) * 100);
                    document.getElementById('progressFill').style.width = pct + "%";
                    document.getElementById('status').innerText = `İlerleme: %${pct} (${updatedCount}/${validTraps.length} güncellendi)`;
                }

                document.getElementById('status').innerText = `🎉 Tamamlandı! Toplam ${updatedCount} adet tuzağın rakım bilgisi güncellendi.`;
                log("🎉 İşlem başarıyla tamamlandı.");

            } catch (err) {
                log(`🚨 HATA OLUŞTU: ${err.message}`);
                document.getElementById('status').innerText = "Hata oluştu! Günlük detaylarını inceleyin.";
            }

            document.getElementById('startBtn').disabled = false;
        }
    </script>
</body>
</html>
